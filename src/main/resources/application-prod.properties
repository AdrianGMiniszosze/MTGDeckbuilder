# Production profile - hardened for production deployment

# Server
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Do not trust forwarded headers unless a trusted proxy configuration is added.
server.forward-headers-strategy=none

# Database Configuration - Production database (from environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
# Dialect is auto-detected from JDBC metadata; pinning it makes Hibernate 6 log HHH90000025.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Production starts from a clean migrated schema. Existing installations must
# baseline explicitly after reviewing their schema; never auto-baseline here.
spring.flyway.baseline-on-migrate=false

# Connection Pool - Optimized for production load
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Authentication: required secret, bootstrap off, and shared rate limiting on.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=PT15M
app.security.jwt.refresh-token-ttl=P7D
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrator}
app.security.bootstrap-admin.country=${BOOTSTRAP_ADMIN_COUNTRY:US}
app.security.rate-limit.enabled=true

# Exact HTTPS browser origins; comma-separated, no wildcard.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# SMTP provider and frontend links are mandatory in prod.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
app.security.email.from=${MAIL_FROM}
app.security.email.frontend-base-url=${APP_PUBLIC_URL}
app.security.email.verification-path=/verify-email
app.security.email.password-reset-path=/reset-password
app.security.email.verification-token-ttl=P1D
app.security.email.password-reset-token-ttl=PT1H
app.security.email.token-cleanup-delay=PT1H

# Logging: console-only; never log request bodies or bearer/action tokens.
logging.config=classpath:logback-prod.xml
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.com.deckbuilder=INFO

# Actuator endpoints are additionally restricted by SecurityConfig.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.metrics.export.prometheus.enabled=true
