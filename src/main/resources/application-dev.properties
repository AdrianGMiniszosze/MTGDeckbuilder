# Development profile - local development with Docker Compose

# Server
server.port=8080

# Database Configuration - Local Docker Compose instance
spring.datasource.url=jdbc:postgresql://localhost:5433/mtg_db
spring.datasource.username=user
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
app.jwt.secret=${JWT_SECRET:mySecretKeyForLocalDevOnlyChangeInProduction12345}
app.jwt.expiration=604800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Logging - Verbose for development
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.com.deckbuilder=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator - expose all endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
