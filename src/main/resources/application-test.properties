# Test profile - in-memory H2 database for unit and integration tests

# Server
server.port=8081

# Database Configuration - H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:mtg_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JWT Configuration for tests
app.jwt.secret=testSecretKeyForJwtValidationAndGeneration123456789012345
app.jwt.expiration=3600000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool - Minimal for tests
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# Logging - Error only for test output clarity
logging.level.root=ERROR
logging.level.org.springframework.test=INFO
logging.level.com.deckbuilder=INFO
