# Testcontainers profile configuration
# Datasource is injected dynamically via @DynamicPropertySource in PostgresIntegrationTest

# DDL: let Hibernate create/drop schema from entities (real PostgreSQL, pgvector extension pre-enabled)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable external SQL init scripts (schema is managed by Hibernate DDL)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Server / app
server.port=0
spring.main.banner-mode=off

# Logging configuration for tests
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JPA optimizations for tests
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# Test-specific configurations
spring.test.database.replace=none

# Disable Liquibase/Flyway for tests (if present)
spring.liquibase.enabled=false
spring.flyway.enabled=false

# Transaction configuration for tests
spring.transaction.rollback-on-commit-failure=true
