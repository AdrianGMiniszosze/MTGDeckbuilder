name: Build Check

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  package:
    name: Package JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Verify the full build (codegen + compile + package) passes without tests.
      # This catches broken OpenAPI specs, compile errors, and packaging issues.
      - name: Build JAR (skip tests)
        run: ./mvnw package -DskipTests -q

      - name: Verify JAR exists
        run: |
          $jar = Get-ChildItem target/*.jar -ErrorAction Stop | Select-Object -First 1
          Write-Host "JAR built: $($jar.Name) ($([math]::Round($jar.Length / 1MB, 1)) MB)"
        shell: pwsh

