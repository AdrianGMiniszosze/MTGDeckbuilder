name: Build Check

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  package:
    name: Package JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Verify the full build (codegen + compile + package) passes without tests.
      # This catches broken OpenAPI specs, compile errors, and packaging issues.
      - name: Build JAR (skip tests)
        run: ./mvnw package -DskipTests -q

      - name: Verify JAR exists
        run: |
          jar=$(ls -1 target/*.jar 2>/dev/null | head -n1)
          test -n "$jar" || { echo "No JAR found in target/"; exit 1; }
          echo "JAR built: $(basename "$jar") ($(du -h "$jar" | cut -f1))"

